name: "Vevor BLE Bridge"
description: "Bridge für Vevor-Geräte über Bluetooth Low Energy (BLE)"
version: "0.1.0"
slug: "vevor_ble_bridge"
init: false
startup: application
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
uart: true
host_network: true
privileged:
  - NET_ADMIN
  - SYS_ADMIN
host_dbus: true
devices:
  - /dev/ttyAMA0
  - /dev/vcio
  - /dev/ttyS0
  - /dev/ttyS1
  - /dev/serial0
  - /dev/serial1
  - /dev/mem
gpio: true
apparmor: false
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_topic: "vevor"
  scan_interval: 60
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: str
  mqtt_topic: str
  scan_interval: int